name: fakeapp

# Base stack: nginx (TLS termination, certificates) in front of the decoy app.
#   nginx/docker-compose.yml       nginx + the one-shot certbot service
#   fake-webapp/docker-compose.yml the decoy web application (internal network only)
#   data/extensions.compose.yml    generated by fakeapp.sh (gitignored): the
#                                  compose files that installed extensions
#                                  registered; `services: {}` when there are none
# Extensions never edit this file (see extensions.d/README.md).
include:
  - nginx/docker-compose.yml
  - fake-webapp/docker-compose.yml
  - data/extensions.compose.yml
