# TLS front proxy (nginx) with automatic Let's Encrypt certificates (certbot).
#
# Use it from the main compose file of a project:
#
#   include:
#     - nginx/docker-compose.yml
#
# nginx listens on 80/443 of the host and proxies everything to the `fakeapp`
# service by default (port 80 redirects to https when DOMAIN is set; the ACME
# challenge is served on 80). certbot obtains and renews the certificate for
# DOMAIN; nginx picks it up and reloads by itself.
#
# With WEBPROXY_SUBDOMAIN set, nginx also serves <WEBPROXY_SUBDOMAIN>.<DOMAIN>
# (own certificate, own certbot run) and proxies it to the Telemt service from
# webproxy/docker-compose.yml over the `webproxy` network.
#
# Certificates live in the shared Docker volume `tls-certs` (TLS_CERTS_VOLUME),
# laid out like /etc/letsencrypt. Other containers, including ones from other
# compose projects, can reuse them:
#
#   services:
#     xray:
#       volumes:
#         - tls-certs:/etc/letsencrypt:ro   # live/<DOMAIN>/fullchain.pem, privkey.pem
#   volumes:
#     tls-certs:
#       external: true
#
# Relative paths below are resolved against this directory (nginx/).

services:
  nginx:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Master process: chown temp dirs and drop privileges to the nginx user.
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DOMAIN: ${DOMAIN:-}
      # Telegram web-proxy subdomain (empty = feature off), see webproxy/.
      WEBPROXY_DOMAIN: ${WEBPROXY_SUBDOMAIN:+${WEBPROXY_SUBDOMAIN}.${DOMAIN}}
      WEBPROXY_NGINX_IP: ${WEBPROXY_NGINX_IP:-172.30.53.2}
      WEBPROXY_TELEMT_IP: ${WEBPROXY_TELEMT_IP:-172.30.53.3}
      # Port fakeapp listens on inside its container (same variable as there).
      FAKEAPP_PORT: ${FAKEAPP_PORT:-8080}
      # 1: post-quantum X25519MLKEM768 allowed (default), 0: classic groups.
      TLS_PQ: ${TLS_PQ:-1}
      TZ: ${TZ:-UTC}
    networks:
      default:
      # Reaches Telemt (webproxy/) with a fixed address, and Telemt reaches
      # nginx's decoy listener on 8081 (not published).
      webproxy:
        ipv4_address: ${WEBPROXY_NGINX_IP:-172.30.53.2}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - tls-certs:/etc/letsencrypt:ro
      - acme-webroot:/var/www/acme:ro
    tmpfs:
      - /tmp
      - /run
      - /var/cache/nginx

  certbot:
    build:
      context: .
      dockerfile: Dockerfile.certbot
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DOMAIN: ${DOMAIN:-}
      WEBPROXY_DOMAIN: ${WEBPROXY_SUBDOMAIN:+${WEBPROXY_SUBDOMAIN}.${DOMAIN}}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_STAGING: ${ACME_STAGING:-0}
      TZ: ${TZ:-UTC}
    volumes:
      - tls-certs:/etc/letsencrypt
      - acme-webroot:/var/www/acme
    tmpfs:
      - /tmp
      - /var/lib/letsencrypt
      - /var/log/letsencrypt
    depends_on:
      - nginx

networks:
  # Shared with webproxy/docker-compose.yml, which declares it identically
  # (every included file is its own model, so each one must define it).
  webproxy:
    name: ${COMPOSE_PROJECT_NAME:-vpn}_webproxy
    ipam:
      config:
        - subnet: ${WEBPROXY_SUBNET:-172.30.53.0/24}

volumes:
  # Shared certificate store (fixed name, not prefixed with the project name).
  tls-certs:
    name: ${TLS_CERTS_VOLUME:-tls-certs}
  # HTTP-01 challenge files: written by certbot, served by nginx.
  acme-webroot:
