# nginx in a container: terminates TLS for the decoy app (fakeapp) and answers
# ACME http-01 challenges; plus the one-shot certbot service.
#
# Use it from the main compose file of a project:
#
#   include:
#     - nginx/docker-compose.yml
#
# Relative paths below are resolved against this directory (nginx/).
# Variables are interpolated from the including project's environment/.env
# (see ../.env.example). The site config is generated by `install.sh` from
# default.conf.template into ../data/nginx/conf.d/ (do not edit it by hand).

services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-5m}"
        max-file: "${LOG_MAX_FILE:-3}"
    ports:
      - "${NGINX_HTTP_PORT:-80}:80/tcp"
      - "${NGINX_HTTPS_PORT:-443}:443/tcp"
    healthcheck:
      test: ["CMD-SHELL", "pidof nginx >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    volumes:
      # Generated site config (install.sh renders default.conf.template here).
      - ../data/nginx/conf.d:/etc/nginx/conf.d:ro
      # One .conf file per extension (a location block), included in the 443 server.
      - ../data/nginx/locations.d:/etc/nginx/locations.d:ro
      # One .conf file per extension with its own name (whole server blocks, http level).
      - ../data/nginx/servers.d:/etc/nginx/servers.d:ro
      # ACME http-01 webroot (written by certbot).
      - ../data/nginx/webroot:/var/www/acme:ro
      # Temporary self-signed certificate, used until a real one is issued.
      - ../data/nginx/selfsigned:/etc/nginx/selfsigned:ro
      # Let's Encrypt state (certificates, account, renewal config).
      - ../data/letsencrypt:/etc/letsencrypt:ro

  # One-shot: `docker compose run --rm -T certbot <args>` (no resident container;
  # the profile keeps it out of `docker compose up`).
  certbot:
    image: certbot/certbot
    profiles: ["tools"]
    entrypoint: ["certbot"]
    volumes:
      - ../data/letsencrypt:/etc/letsencrypt
      - ../data/nginx/webroot:/var/www/acme
