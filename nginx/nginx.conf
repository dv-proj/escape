# TLS front proxy. Everything (both ports, any Host/SNI) goes to fakeapp by
# default; only the ACME HTTP-01 challenge is answered from the shared webroot.
# The certificate is installed into /tmp/tls by entrypoint.sh (Let's Encrypt
# certificate from the shared volume, or a self-signed fallback).

user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    access_log /dev/stdout combined;
    sendfile on;
    keepalive_timeout 65s;
    client_max_body_size 1m;

    # The root filesystem is read-only: temp files live on the /tmp tmpfs.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Docker's embedded DNS: upstreams are resolved per request (see
    # snippets/fakeapp.conf), so nginx starts even before fakeapp exists and
    # follows its address when the container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Key exchange groups (TLS_PQ), generated by entrypoint.sh.
    include /tmp/nginx/tls-groups.conf;

    # Upgrade/Connection pair for the web-proxy vhost (fakeapp keeps its own
    # fixed `Connection ""`).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 80 default_server;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            # Unknown challenge paths look like any other page of the site.
            try_files $uri @fakeapp;
        }

        location @fakeapp {
            include /etc/nginx/snippets/fakeapp.conf;
        }

        # Generated by entrypoint.sh: redirect to https when DOMAIN is set,
        # otherwise proxy to fakeapp.
        include /tmp/nginx/http-default.conf;
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate /tmp/tls/fullchain.pem;
        ssl_certificate_key /tmp/tls/privkey.pem;

        location / {
            include /etc/nginx/snippets/fakeapp.conf;
        }
    }

    # Generated by entrypoint.sh, empty unless the web-proxy subdomain is
    # configured: its port 80 (ACME + redirect) and 443/8081 servers.
    include /tmp/nginx/webproxy-http.conf;
    include /tmp/nginx/webproxy-https.conf;
}
