# Main nginx config of the stack (mounted read-only over /etc/nginx/nginx.conf;
# the stock one of the image without the stream block). Not rendered: the
# generated parts live in data/nginx/ (see nginx/docker-compose.yml):
#   http   : conf.d/*.conf   (default.conf, rendered from default.conf.template;
#            it includes locations.d/ and servers.d/ of the extensions)
#   stream : conf.d/*.stream (front.stream, rendered from stream.conf.template:
#            the TLS front on the published HTTPS port; it includes stream.d/)

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}

stream {
    include /etc/nginx/conf.d/*.stream;
}
