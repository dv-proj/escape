# Proxy the request to the fakeapp service (compose service name). A variable
# in proxy_pass makes nginx resolve the name at request time; the original
# request URI is passed through unchanged. $fakeapp_upstream
# (http://fakeapp:$FAKEAPP_PORT) is generated by entrypoint.sh.
include /tmp/nginx/fakeapp-upstream.conf;
proxy_pass $fakeapp_upstream;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# fakeapp rate-limits by X-Real-IP.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
