<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.AppName}}</title>
<meta name="description" content="{{.Description}}">
<meta name="keywords" content="{{.Keywords}}">
<meta name="robots" content="index, follow">
{{if .BaseURL}}<link rel="canonical" href="{{.BaseURL}}">{{end}}
<meta property="og:title" content="{{.AppName}}">
<meta property="og:description" content="{{.Description}}">
<meta property="og:type" content="website">
{{if .BaseURL}}<meta property="og:url" content="{{.BaseURL}}">{{end}}
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{.AppName}}">
<meta name="twitter:description" content="{{.Description}}">
<script type="application/ld+json" nonce="{{.Nonce}}">{{.JSONLD}}</script>
<style nonce="{{.Nonce}}">
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f3f5f9;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1f2937}
.card{width:100%;max-width:380px;margin:16px;background:#fff;border-radius:10px;box-shadow:0 8px 30px rgba(15,23,42,.1);padding:36px 32px}
h1{margin:0 0 4px;font-size:24px;color:#0f3d91}
.sub{margin:0 0 24px;color:#6b7280;font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:6px;font-size:15px}
input:focus{outline:2px solid #bcd0f7;border-color:#2563eb}
button{width:100%;margin-top:22px;padding:11px;background:#2563eb;color:#fff;border:0;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer}
button:hover{background:#1d4ed8}
.err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:10px 12px;border-radius:6px;font-size:14px;margin-bottom:6px}
.time{margin-top:24px;text-align:center;color:#6b7280;font-size:12px}
</style>
</head>
<body>
<main class="card">
<h1>{{.AppName}}</h1>
<p class="sub">Sign in to continue</p>
{{if .Error}}<div class="err" role="alert">{{.Error}}</div>{{end}}
{{if not .HideForm}}
<form method="post" action="/login" autocomplete="on">
<label for="username">Username</label>
<input id="username" name="username" type="text" autocomplete="username" required>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button>
</form>
{{end}}
<div class="time">Server time: <span id="clock" data-ts="{{.UnixMilli}}" data-off="{{.OffsetSec}}">{{.Time}}</span></div>
</main>
<script nonce="{{.Nonce}}">
(function(){var e=document.getElementById("clock"),o=Date.now()-Number(e.dataset.ts),z=Number(e.dataset.off)*1000;
function p(n){return(n<10?"0":"")+n}
setInterval(function(){var d=new Date(Date.now()-o+z);
e.textContent=d.getUTCFullYear()+"-"+p(d.getUTCMonth()+1)+"-"+p(d.getUTCDate())+" "+p(d.getUTCHours())+":"+p(d.getUTCMinutes())+":"+p(d.getUTCSeconds());},1000);})();
</script>
</body>
</html>
